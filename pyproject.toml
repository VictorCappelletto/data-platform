[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform"
version = "0.2.0"
description = "Portfolio data platform — YAML configs, medallion lake, shared dataplatform SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Cappelletto" }]
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
sql = ["pyodbc>=5.0"]
azure = ["pyodbc>=5.0", "pyarrow>=15.0"]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]
olist = ["pyodbc>=5.0", "pyarrow>=15.0", "pyspark>=3.5", "azure-identity>=1.15", "azure-storage-file-datalake>=12.14"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dataplatform*"]

[tool.pytest.ini_options]
testpaths = ["apps/medalion_ingestion_project/tests", "apps/ingestion_azure/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dataplatform", "ingestion", "extraction", "transformation", "consumption", "orchestrator", "quality", "workflows", "utils"]
