[project]
name = "data-platform"
version = "0.1.0"
description = "Portfolio data platform monorepo — shared libs + HDL/KPI/analytics products"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Cappelletto" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "python-dotenv>=1.0"]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]

[tool.pytest.ini_options]
testpaths = [
  "libs/platform_utils/tests",
  "libs/platform_dbutils/tests",
  "libs/platform_secrets/tests",
  "libs/platform_dq/tests",
  "products/hdl_ingest/tests",
  "products/kpi_metrics/tests",
  "products/analytics_export/tests",
]
pythonpath = [
  "libs/platform_utils/src",
  "libs/platform_dbutils/src",
  "libs/platform_secrets/src",
  "libs/platform_dq/src",
  "products/hdl_ingest/src",
  "products/kpi_metrics/src",
  "products/analytics_export/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
