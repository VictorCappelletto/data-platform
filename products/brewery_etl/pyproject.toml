[project]
name = "brewery-etl"
version = "0.1.0"
description = "Open Brewery API ETL — landing to gold with partitioned lake writes"
requires-python = ">=3.10"
dependencies = [
  "platform-utils",
  "platform-dbutils",
  "platform-secrets",
  "platform-dq",
  "requests>=2.32",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
