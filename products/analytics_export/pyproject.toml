[project]
name = "analytics-export"
version = "0.1.0"
description = "Analytics export product with DQ gates"
requires-python = ">=3.10"
dependencies = [
  "platform-utils",
  "platform-dbutils",
  "platform-dq",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
