[project]
name = "kpi-metrics"
version = "0.1.0"
description = "KPI product — silver to gold metrics"
requires-python = ">=3.10"
dependencies = [
  "platform-utils",
  "platform-dbutils",
  "hdl-ingest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
