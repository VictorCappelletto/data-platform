dag_id: hdl_ingest
schedule: "@daily"
catchup: false
tags: [hdl, medallion, orders, ingestion]
owner: data-platform
process: ingestion
product: hdl_ingest
orchestration: orchestration/hdl_ingest.yml

tasks:
  - task_id: landing
    orchestrator: orchestrator.orders.landing:run
  - task_id: bronze
    orchestrator: orchestrator.orders.bronze:run
    upstream: [landing]
  - task_id: silver
    orchestrator: orchestrator.orders.silver:run
    upstream: [bronze]
