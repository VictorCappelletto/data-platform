workflow_id: hdl_ingest
dag_config: workflows/hdl_ingest.yml
description: Orders medallion ingestion (landing → bronze → silver)
domain: orders
process: ingestion

tasks:
  landing:
    orchestrator: orchestrator.orders.landing:run
    domain_module: ingestion.orders:run_landing
  bronze:
    orchestrator: orchestrator.orders.bronze:run
    domain_module: ingestion.orders:run_bronze
  silver:
    orchestrator: orchestrator.orders.silver:run
    domain_module: ingestion.orders:run_silver
