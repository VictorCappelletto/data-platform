[project]
name = "platform-dq"
version = "0.1.0"
description = "Pluggable data-quality checks for lake tables"
requires-python = ">=3.10"
dependencies = ["platform-utils"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
