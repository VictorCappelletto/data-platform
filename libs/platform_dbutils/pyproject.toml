[project]
name = "platform-dbutils"
version = "0.1.0"
description = "Lake paths, Spark session helpers, and table IO"
requires-python = ">=3.10"
dependencies = ["platform-utils", "platform-secrets"]

[project.optional-dependencies]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
