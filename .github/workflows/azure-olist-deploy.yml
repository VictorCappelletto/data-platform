name: azure-olist-deploy

on:
  workflow_dispatch:
    inputs:
      skip_infra:
        description: "Skip Bicep deploy (infra already up)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_seed:
        description: "Skip Azure SQL seed"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_pipeline:
        description: "Skip ADF master pipeline trigger"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-olist-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-olist-dev
  LOCATION: eastus
  DEPLOYMENT_NAME: github-olist-${{ github.run_number }}

jobs:
  infra:
    if: inputs.skip_infra != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt secrets (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY not set — using AZURE_SQL_ADMIN_PASSWORD secret"
            exit 0
          fi
          mkdir -p encrypted-secrets
          printf '%s' "$SOPS_AGE_KEY" > encrypted-secrets/.age-key
          chmod 600 encrypted-secrets/.age-key
          docker compose --profile secrets run --rm secrets prepare

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        env:
          AZURE_SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
        run: |
          PASS=""
          if [ -f .env ]; then
            PASS=$(grep -E '^AZURE_SQL_ADMIN_PASSWORD=' .env | cut -d= -f2- || true)
            [ -z "$PASS" ] && PASS=$(grep -E '^MSSQL_SA_PASSWORD=' .env | cut -d= -f2- || true)
          fi
          [ -z "$PASS" ] && PASS="$AZURE_SQL_ADMIN_PASSWORD"
          if [ -z "$PASS" ]; then
            echo "Set AZURE_SQL_ADMIN_PASSWORD or SOPS_AGE_KEY"
            exit 1
          fi
          az deployment sub create \
            --location "${{ env.LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam sqlAdminPassword="$PASS" \
            --name "${{ env.DEPLOYMENT_NAME }}"

      - name: Write deploy outputs
        run: |
          OUT="deploy-outputs.env"
          az deployment sub show --name "${{ env.DEPLOYMENT_NAME }}" --query properties.outputs -o json > /tmp/out.json
          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/out.json").read_text())
          lines = []
          mapping = {
              "AZURE_STORAGE_ACCOUNT": "storageAccountName",
              "AZURE_ADLS_ENDPOINT": "adlsEndpoint",
              "AZURE_DATA_FACTORY_NAME": "dataFactoryName",
              "AZURE_SQL_SERVER": "sqlServerFqdn",
              "AZURE_SQL_ADMIN_LOGIN": "sqlAdminLogin",
              "AZURE_SQL_OLIST_DATABASE": "olistDatabaseName",
              "AZURE_SQL_DW_DATABASE": "olistDwDatabaseName",
              "AZURE_ACR_NAME": "acrName",
              "AZURE_ACR_LOGIN_SERVER": "acrLoginServer",
              "AZURE_BATCH_ACCOUNT_NAME": "batchAccountName",
              "AZURE_BATCH_ACCOUNT_URL": "batchAccountUrl",
              "AZURE_BATCH_POOL_NAME": "batchPoolName",
              "AZURE_BATCH_STORAGE_ACCOUNT_NAME": "batchStorageAccountName",
              "AZURE_BATCH_POOL_IDENTITY_CLIENT_ID": "batchPoolIdentityClientId",
          }
          for env_key, out_key in mapping.items():
              val = data.get(out_key, {}).get("value", "")
              lines.append(f"{env_key}={val}")
          acr = data.get("acrLoginServer", {}).get("value", "")
          img = data.get("transformImageName", {}).get("value", "olist-transform:latest")
          lines.append(f"AZURE_TRANSFORM_IMAGE={acr}/{img}")
          Path("deploy-outputs.env").write_text("\n".join(lines) + "\n")
          PY
          cat deploy-outputs.env

      - name: Upload deploy outputs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-outputs
          path: deploy-outputs.env

  app:
    needs: infra
    if: always() && (needs.infra.result == 'success' || inputs.skip_infra == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download deploy outputs
        if: inputs.skip_infra != 'true'
        uses: actions/download-artifact@v4
        with:
          name: deploy-outputs

      - name: Build .env for scripts
        env:
          AZURE_SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
        run: |
          touch .env
          if [ -f deploy-outputs.env/deploy-outputs.env ]; then
            cat deploy-outputs.env/deploy-outputs.env >> .env
          elif [ -f deploy-outputs.env ]; then
            cat deploy-outputs.env >> .env
          else
            echo "No artifact — reading latest subscription deployment outputs"
            az deployment sub list \
              --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" -o tsv \
              > /tmp/deploy_name.txt
            DEPLOY="$(cat /tmp/deploy_name.txt)"
            az deployment sub show --name "$DEPLOY" --query properties.outputs -o json > /tmp/out.json
            python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/out.json").read_text())
          def v(k): return data.get(k, {}).get("value", "")
          acr = v("acrLoginServer")
          img = v("transformImageName") or "olist-transform:latest"
          lines = [
              f"AZURE_STORAGE_ACCOUNT={v('storageAccountName')}",
              f"AZURE_DATA_FACTORY_NAME={v('dataFactoryName')}",
              f"AZURE_SQL_SERVER={v('sqlServerFqdn')}",
              f"AZURE_SQL_ADMIN_LOGIN={v('sqlAdminLogin')}",
              f"AZURE_SQL_OLIST_DATABASE={v('olistDatabaseName')}",
              f"AZURE_SQL_DW_DATABASE={v('olistDwDatabaseName')}",
              f"AZURE_ACR_LOGIN_SERVER={acr}",
              f"AZURE_BATCH_ACCOUNT_NAME={v('batchAccountName')}",
              f"AZURE_BATCH_ACCOUNT_URL={v('batchAccountUrl')}",
              f"AZURE_BATCH_POOL_NAME={v('batchPoolName')}",
              f"AZURE_BATCH_STORAGE_ACCOUNT_NAME={v('batchStorageAccountName')}",
              f"AZURE_BATCH_POOL_IDENTITY_CLIENT_ID={v('batchPoolIdentityClientId')}",
              f"AZURE_TRANSFORM_IMAGE={acr}/{img}",
          ]
          Path(".env").write_text("\n".join(lines) + "\n")
          PY
          fi
          if ! grep -q '^AZURE_SQL_ADMIN_PASSWORD=' .env 2>/dev/null; then
            echo "AZURE_SQL_ADMIN_PASSWORD=${AZURE_SQL_ADMIN_PASSWORD}" >> .env
          fi
          echo "MSSQL_SA_PASSWORD=$(grep AZURE_SQL_ADMIN_PASSWORD .env | cut -d= -f2-)" >> .env
          cat .env | sed 's/PASSWORD=.*/PASSWORD=***/'

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install sqlcmd
        if: inputs.skip_seed != 'true'
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> "$GITHUB_ENV"

      - name: Seed Azure SQL
        if: inputs.skip_seed != 'true'
        run: |
          SERVER=$(grep '^AZURE_SQL_SERVER=' .env | cut -d= -f2-)
          LOGIN=$(grep '^AZURE_SQL_ADMIN_LOGIN=' .env | cut -d= -f2-)
          PASS=$(grep '^AZURE_SQL_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          LOGIN="${LOGIN:-olistadmin}"
          for script in 01_create_olist_db.sql 02_seed_sample_data.sql 03_seed_bulk_orders.sql 04_create_olist_dw.sql; do
            echo "Running $script ..."
            sqlcmd -S "$SERVER" -U "$LOGIN" -P "$PASS" -C -i "docker/sql/init/$script"
          done

      - name: Build and push transform image
        run: |
          ACR=$(grep '^AZURE_ACR_LOGIN_SERVER=' .env | cut -d= -f2-)
          IMAGE=$(grep '^AZURE_TRANSFORM_IMAGE=' .env | cut -d= -f2-)
          az acr login --name "${ACR%%.azurecr.io}"
          docker build -f docker/ingestion_azure/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Publish ADF artifacts
        shell: pwsh
        run: |
          ./docker/azure/publish-adf.ps1 -EnvFile .env

      - name: Trigger master pipeline
        if: inputs.skip_pipeline != 'true'
        run: |
          ADF=$(grep '^AZURE_DATA_FACTORY_NAME=' .env | cut -d= -f2-)
          RUN_ID=$(az datafactory pipeline create-run \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --factory-name "$ADF" \
            --name pl_olist_end_to_end \
            --query runId -o tsv)
          echo "Started pl_olist_end_to_end run: $RUN_ID"
          for i in $(seq 1 180); do
            STATUS=$(az datafactory pipeline-run show \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --factory-name "$ADF" \
              --run-id "$RUN_ID" \
              --query status -o tsv)
            echo "Status: $STATUS"
            [ "$STATUS" = "Succeeded" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] && exit 1
            sleep 30
          done
          echo "Timed out"
          exit 1
