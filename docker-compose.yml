x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    PYTHONPATH: /opt/airflow:/opt/airflow/apps/medalion_ingestion_project
    DATA_PLATFORM_ROOT: /opt/airflow
    DATA_PLATFORM_APP: medalion_ingestion_project
    LAKE_ROOT: /opt/airflow/data/lake
    PLATFORM_ENV: local
  volumes:
    - ./apps/medalion_ingestion_project/workflows:/opt/airflow/dags/medalion_ingestion_project
    - ./dataplatform:/opt/airflow/dataplatform
    - ./config:/opt/airflow/config
    - ./apps/medalion_ingestion_project:/opt/airflow/apps/medalion_ingestion_project
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: data-platform-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Olist@Dev123!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        airflow pools set brewery_pool 2 "Brewery ETL concurrency" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  spark-master:
    image: bitnami/spark:3.5
    profiles: ["spark"]
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./data/lake:/data/lake

  spark-worker:
    image: bitnami/spark:3.5
    profiles: ["spark"]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./data/lake:/data/lake
    depends_on:
      - spark-master

  # SOPS + age — encrypt/decrypt env vars (profile: secrets)
  # Usage: docker compose --profile secrets run --rm secrets init
  secrets:
    build: docker/secrets
    profiles: ["secrets"]
    volumes:
      - .:/workspace
    environment:
      SOPS_AGE_KEY_FILE: /workspace/encrypted-secrets/.age-key
      SECRETS_FILE: /workspace/encrypted-secrets/local.env

  # Azure CLI — OIDC setup for GitHub Actions (profile: azure)
  # Requires host `az login`; mounts %USERPROFILE%\.azure
  azure:
    build: docker/azure
    profiles: ["azure"]
    volumes:
      - .:/workspace
      - ${USERPROFILE}/.azure:/root/.azure:ro
    environment:
      AZURE_CONFIG_DIR: /root/.azure
      GITHUB_REPO: VictorCappelletto/data-platform
      GITHUB_BRANCH: publish-main

volumes:
  minio_data:
  sqlserver_data:
